function qc(id){return id==='all'?Q.length:Q.filter(q=>q.topic===id).length}
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}

// ── GEMINI API ────────────────────────────────────────────
const GEMINI_BASE='https://generativelanguage.googleapis.com/v1beta/models';

async function detectModel(key){
  try{
    const stored=localStorage.getItem('mrcpch_gemini_model');
    if(stored)return stored;
    const r=await fetch(`${GEMINI_BASE}?key=${key}`);
    if(!r.ok)throw new Error();
    const d=await r.json();
    const models=d.models||[];
    const prefer=['gemini-2.5-flash','gemini-1.5-flash','gemini-1.0-pro','gemini-pro'];
    for(const p of prefer){
      if(models.some(m=>m.name&&m.name.includes(p))){
        localStorage.setItem('mrcpch_gemini_model',p);
        return p;
      }
    }
    return 'gemini-1.5-flash';
  }catch{return 'gemini-1.5-flash';}
}

async function askGemini(key,prompt){
  const model=await detectModel(key);
  const r=await fetch(`${GEMINI_BASE}/${model}:generateContent?key=${key}`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{maxOutputTokens:8192}
    })
  });
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'API error');}
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'No response';
}

// ── SETUP MODAL ───────────────────────────────────────────
function SetupModal({onClose}){
  const [key,setKey]=useState(localStorage.getItem('mrcpch_apikey')||'');
  const [model,setModel]=useState(localStorage.getItem('mrcpch_gemini_model')||'');
  const [testing,setTesting]=useState(false);
  const [msg,setMsg]=useState('');

  const save=async()=>{
    if(!key.trim()){setMsg('Please enter an API key');return;}
    localStorage.setItem('mrcpch_apikey',key.trim());
    localStorage.removeItem('mrcpch_gemini_model');
    setTesting(true);setMsg('');
    try{
      const m=await detectModel(key.trim());
      setModel(m);
      setMsg('✅ Connected! Model: '+m);
    }catch(e){setMsg('❌ Error: '+e.message);}
    setTesting(false);
  };

  const clear=()=>{
    localStorage.removeItem('mrcpch_apikey');
    localStorage.removeItem('mrcpch_gemini_model');
    setKey('');setModel('');setMsg('Cleared.');
  };

  return h('div',{className:'ovl',onClick:e=>{if(e.target.className==='ovl')onClose();}},
    h('div',{className:'mdl'},
      h('div',{className:'mdl-t'},'⚙️ AI Tutor Setup'),
      h('div',{className:'mdl-s'},'Free Gemini API key from aistudio.google.com — no payment needed'),
      model&&h('div',{className:'model-info'},'Active model: '+model),
      h('input',{className:'inp',type:'password',placeholder:'Paste your Gemini API key here...',value:key,onChange:e=>setKey(e.target.value)}),
      msg&&h('div',{style:{fontSize:'12px',color:msg.startsWith('✅')?'var(--ok)':'var(--ng)',marginBottom:'10px',fontFamily:"'JetBrains Mono',monospace"}},msg),
      h('div',{className:'mdl-row'},
        h('button',{className:'btn bg',onClick:onClose},'Close'),
        h('button',{className:'btn bg',style:{color:'var(--ng)'},onClick:clear},'Clear'),
        h('button',{className:'btn bp',style:{gridColumn:'1/-1'},onClick:save,disabled:testing},testing?'Testing...':'Save & Test')
      )
    )
  );
}

// ── AI TUTOR COMPONENT ────────────────────────────────────
function AiTutor({question,userAnswer,isCorrect}){
  const [resp,setResp]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  const key=localStorage.getItem('mrcpch_apikey');

  if(!key) return h('div',{className:'no-key'},'💡 Add a Gemini API key (⚙️ top right) for AI explanations');

  const ask=async()=>{
    setLoading(true);setResp('');setErr('');
    const L=['A','B','C','D','E','F','G'];
    const prompt=`MRCPCH Statistics tutor. Be VERY BRIEF.

Q: ${question.q}
Answer: ${L[question.ans]}. ${question.opts[question.ans]}
Student: ${L[userAnswer]}. ${question.opts[userAnswer]} (${isCorrect?'CORRECT':'WRONG'})

Reply in EXACTLY this format — no extra text:
✅ WHY CORRECT: [1 sentence max]
❌ WHY WRONG: [only if student was wrong — 1 sentence on their specific choice, skip if correct]
⚡ EXAM RULE: [the single key rule or mnemonic]
📐 FORMULA: [only if a formula applies — omit otherwise]

Max 4 lines. No intro. No summary. No paragraphs.`;
    try{
      const r=await askGemini(key,prompt);
      setResp(r);
    }catch(e){setErr('Error: '+e.message);}
    setLoading(false);
  };

  return h('div',null,
    !resp&&!loading&&h('button',{className:'ai-btn',onClick:ask},'🤖 Ask AI Tutor to explain this question'),
    loading&&h('div',{className:'ai-box'},h('div',{className:'ai-hd'},'🤖 AI Tutor'),h('div',{className:'ai-loading'},h('div',{className:'ai-dot'}),h('div',{className:'ai-dot'}),h('div',{className:'ai-dot'}),h('span',{style:{fontSize:'12px',color:'var(--mu)',marginLeft:'4px'}},'Thinking...'))),
    err&&h('div',{style:{fontSize:'12px',color:'var(--ng)',marginTop:'8px'}},err),
    resp&&h('div',{className:'ai-box'},
      h('div',{className:'ai-hd'},'🤖 ','AI Tutor — Gemini'),
      h('div',{className:'ai-tx',dangerouslySetInnerHTML:{__html:resp.replace(/\n/g,'<br/>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>')}})
    )
  );
}

// ── APP ───────────────────────────────────────────────────
function App(){
  const[sc,setSc]=useState('home');
  const[st,setSt]=useState('all');
  const[sf,setSf]=useState(false);
  const[qs,setQs]=useState([]);
  const[cur,setCur]=useState(0);
  const[ans,setAns]=useState({});
  const[se,setSe]=useState(false);
  const[score,setScore]=useState({c:0,t:0});
  const[rf,setRf]=useState('all');
  const[modal,setModal]=useState(false);

  const start=()=>{let q=st==='all'?Q:Q.filter(x=>x.topic===st);if(sf)q=shuf(q);setQs(q);setAns({});setCur(0);setSe(false);setSc('quiz');};
  const pick=(i)=>{if(ans[cur]!==undefined)return;setAns(p=>({...p,[cur]:i}));setSe(true);};
  const next=()=>{if(cur<qs.length-1){setCur(c=>c+1);setSe(false);}else{const c=qs.filter((q,i)=>ans[i]===q.ans).length;setScore({c,t:qs.length});setSc('results');}};
  const prev=()=>{if(cur>0){setCur(c=>c-1);setSe(ans[cur-1]!==undefined);}};
  const home=()=>setSc('home');
  const review=()=>{setRf('all');setSc('review');};

  return h('div',null,
    modal&&h(SetupModal,{onClose:()=>setModal(false)}),
    sc==='home'?h(Home,{st,setSt,sf,setSf,start,onGear:()=>setModal(true)}):
    sc==='quiz'?h(Quiz,{qs,cur,ans,se,pick,next,prev,home,onGear:()=>setModal(true)}):
    sc==='results'?h(Results,{score,home,review,onGear:()=>setModal(true)}):
    h(Review,{qs,ans,rf,setRf,home,onGear:()=>setModal(true)})
  );
}

  const filtered=qs.filter((q,i)=>{if(rf==='correct')return ans[i]===q.ans;if(rf==='wrong')return ans[i]!==undefined&&ans[i]!==q.ans;return true;});
  const L=['A','B','C','D','E','F','G'];
  return h('div',null,
    h('div',{className:'hdr'},h('button',{className:'btn bg',style:{padding:'6px 12px',fontSize:'12px'},onClick:home},'← Home'),h('div',{className:'htx'},h('div',{className:'ht'},'Review'),h('div',{className:'hs'},filtered.length+' questions')),h('button',{className:'gbtn',onClick:onGear},'⚙️')),
    h('div',{className:'main'},
      h('div',{className:'fr'},
        h('div',{className:'ft'+(rf==='all'?' ac':''),onClick:()=>setRf('all')},'All'),
        h('div',{className:'ft'+(rf==='wrong'?' ac':''),onClick:()=>setRf('wrong')},'❌ Wrong'),
